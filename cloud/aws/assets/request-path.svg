<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 800" role="img" aria-label="HTTPS 請求從 Client 經 Route 53、CloudFront 與 WAF，進入 ALB 或 API Gateway，再到 ECS、EKS、EC2、Lambda，讀寫 Redis、Aurora、OpenSearch，並經 VPC Endpoint 存取 DynamoDB、S3、SQS，非同步工作由 worker 消費">
<style>:root{--bg:#EEF2F5;--surface:#FFFFFF;--ink:#111C26;--muted:#566775;--line:#A3B1BD;--zone-pub:#DDEAF0;--zone-priv:#E4E9EF;--zone-async:#E9E6F2;--vpc-line:#7C8E9C;--accent:#C2410C;--accent2:#2456A6;--f-body:"IBM Plex Sans",Arial,sans-serif;--f-mono:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0D151D;--surface:#16212C;--ink:#E7EEF4;--muted:#97A8B7;--line:#43535F;--zone-pub:#12303A;--zone-priv:#141F2A;--zone-async:#1E1B33;--vpc-line:#5B6E7C;--accent:#FF8F5A;--accent2:#86AEF5}}
.bg{fill:var(--bg)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.vpc{fill:none;stroke:var(--vpc-line);stroke-width:1.4;stroke-dasharray:6 4}
.zone-pub{fill:var(--zone-pub)} .zone-priv{fill:var(--zone-priv)} .zone-async{fill:var(--zone-async)}
.t-name{font:600 13px var(--f-body);fill:var(--ink)}
.t-sub{font:400 10.5px var(--f-body);fill:var(--muted)}
.t-lbl{font:500 11px var(--f-mono);fill:var(--ink)}
.t-zone{font:500 10px var(--f-mono);fill:var(--muted);letter-spacing:.06em}
.t-row{font:600 11px var(--f-mono);fill:var(--muted);letter-spacing:.06em}
.t-chip{font:500 11.5px var(--f-mono);fill:var(--ink)}
.chip{fill:var(--surface);stroke:var(--line);stroke-width:1}
.e-sync{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.e-async{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:7 5;stroke-linejoin:round}
.e-ctl{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round}
.m-sync{fill:var(--accent)} .m-async{fill:var(--accent2)} .m-ctl{fill:var(--muted)}
.badge{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.badge-t{font:600 11px var(--f-mono);fill:var(--surface)}</style><rect class="bg" width="1480" height="800"/><defs>
<marker id="a-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="m-sync" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="a-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="m-async" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="a-ctl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="m-ctl" d="M0,0 L8,4 L0,8 z"/></marker>
</defs>
