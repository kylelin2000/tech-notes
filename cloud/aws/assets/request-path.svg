<g><rect class="box" x="595" y="534" width="170" height="48" rx="6"/><text class="t-name" x="605" y="554">Worker</text><text class="t-sub" x="605" y="571">ECS 或 Lambda 消費</text></g>
<g><rect class="box" x="825" y="250" width="210" height="48" rx="6"/><text class="t-name" x="835" y="270">ElastiCache Redis</text><text class="t-sub" x="835" y="287">快取 / session / 限流</text></g>
