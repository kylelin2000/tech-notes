<g><rect class="box" x="1130" y="414" width="200" height="48" rx="6"/><text class="t-name" x="1140" y="434">SQS</text><text class="t-sub" x="1140" y="451">queue / 削峰</text></g>
<g><rect class="box" x="1130" y="474" width="200" height="48" rx="6"/><text class="t-name" x="1140" y="494">SNS / EventBridge</text><text class="t-sub" x="1140" y="511">fan-out / 事件路由</text></g>
<g><rect class="box" x="1130" y="534" width="200" height="48" rx="6"/><text class="t-name" x="1140" y="554">Kinesis / MSK</text><text class="t-sub" x="1140" y="571">串流 / 高吞吐</text></g>
