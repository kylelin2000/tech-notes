<g><rect class="box" x="10" y="340" width="100" height="48" rx="6"/><text class="t-name" x="20" y="360">Client</text><text class="t-sub" x="20" y="377">Browser / App</text></g>
<g><rect class="box" x="170" y="130" width="120" height="48" rx="6"/><text class="t-name" x="180" y="150">Route 53</text><text class="t-sub" x="180" y="167">DNS / 健康檢查</text></g>
<g><rect class="box" x="170" y="344" width="150" height="48" rx="6"/><text class="t-name" x="180" y="364">CloudFront</text><text class="t-sub" x="180" y="381">CDN / ACM 憑證</text></g>
<g><rect class="box" x="170" y="440" width="150" height="48" rx="6"/><text class="t-name" x="180" y="460">WAF + Shield</text><text class="t-sub" x="180" y="477">L7 過濾 / DDoS</text></g>
<g><rect class="box" x="400" y="110" width="150" height="48" rx="6"/><text class="t-name" x="410" y="130">API Gateway</text><text class="t-sub" x="410" y="147">驗證 / 限流 / 轉發</text></g>
<g><rect class="box" x="600" y="110" width="150" height="48" rx="6"/><text class="t-name" x="610" y="130">Cognito</text><text class="t-sub" x="610" y="147">登入 / 發 token</text></g>
<g><rect class="box" x="400" y="344" width="140" height="48" rx="6"/><text class="t-name" x="410" y="364">ALB</text><text class="t-sub" x="410" y="381">L7 / TLS</text></g>
<g><rect class="box" x="400" y="534" width="140" height="48" rx="6"/><text class="t-name" x="410" y="554">NAT Gateway</text><text class="t-sub" x="410" y="571">對外 egress</text></g>
<g><rect class="box" x="595" y="250" width="170" height="48" rx="6"/><text class="t-name" x="605" y="270">ECS on Fargate</text><text class="t-sub" x="605" y="287">container / 免管 node</text></g>
<g><rect class="box" x="595" y="320" width="170" height="48" rx="6"/><text class="t-name" x="605" y="340">EKS</text><text class="t-sub" x="605" y="357">Kubernetes / Pod</text></g>
