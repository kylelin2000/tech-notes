<g><rect class="box" x="825" y="390" width="210" height="48" rx="6"/><text class="t-name" x="835" y="410">OpenSearch</text><text class="t-sub" x="835" y="427">全文搜尋 / log 分析</text></g>
<g><rect class="box" x="825" y="534" width="210" height="48" rx="6"/><text class="t-name" x="835" y="554">VPC Endpoints</text><text class="t-sub" x="835" y="571">私網連 S3 / DynamoDB / SQS</text></g>
<g><rect class="box" x="1130" y="250" width="200" height="48" rx="6"/><text class="t-name" x="1140" y="270">DynamoDB</text><text class="t-sub" x="1140" y="287">NoSQL / key-value</text></g>
