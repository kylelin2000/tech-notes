<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 625" width="860" height="625" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="gearg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bbf"/><stop offset="1" stop-color="#1f4f86"/>
    </linearGradient>
  </defs>

  <rect width="860" height="625" fill="#0d1117"/>

  <!-- ============ Zones ============ -->
  <!-- Left: Management Service -->
  <rect x="2" y="2" width="300" height="428" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="38" y="22" width="244" height="256" fill="none" stroke="#6e7681" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="160" y="46" text-anchor="middle" font-size="20" fill="#8b949e">Management</text>
  <text x="160" y="68" text-anchor="middle" font-size="20" fill="#8b949e">Service</text>

  <!-- Right: cloud backend -->
  <rect x="343" y="2" width="515" height="428" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Bottom: customer -->
  <rect x="2" y="456" width="856" height="140" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="368" y="620" text-anchor="middle" font-size="22" fill="#c9d1d9">Customer</text>

  <!-- ============ Left side components ============ -->
  <g font-size="19" text-anchor="middle" fill="#fff">
    <rect x="46" y="168" width="76" height="40" fill="#238636" stroke="#3fb950"/>
    <text x="84" y="194">Portal</text>
    <rect x="133" y="110" width="76" height="40" fill="#238636" stroke="#3fb950"/>
    <text x="171" y="136">API</text>
    <rect x="141" y="177" width="76" height="40" fill="#238636" stroke="#3fb950"/>
    <text x="179" y="203">Worker</text>
  </g>
  <text x="188" y="87" font-size="11" fill="#8b949e" text-anchor="middle">submit</text>
  <text x="206" y="102" font-size="11" fill="#8b949e" text-anchor="middle">job</text>
  <text x="206" y="233" font-size="11" fill="#8b949e" text-anchor="middle">get</text>
  <text x="206" y="248" font-size="11" fill="#8b949e" text-anchor="middle">result</text>

  <!-- Load balancer (vertical) -->
  <rect x="242" y="100" width="40" height="165" fill="#30363d" stroke="#6e7681"/>
  <text transform="translate(268 182) rotate(-90)" text-anchor="middle" font-size="15" fill="#fff">Load Balancer</text>

  <!-- Load balancer (bottom) -->
  <rect x="57" y="295" width="160" height="40" fill="#30363d" stroke="#6e7681"/>
  <text x="137" y="320" text-anchor="middle" font-size="15" fill="#fff">Load Balancer</text>

  <!-- Console -->
  <g>
    <rect x="130" y="482" width="140" height="88" fill="#161b22" stroke="#6e7681"/>
    <rect x="130" y="482" width="140" height="8" fill="#30363d" stroke="#6e7681"/>
    <g stroke="#30363d" stroke-width="2">
      <line x1="136" y1="500" x2="264" y2="500"/><line x1="136" y1="508" x2="264" y2="508"/>
      <line x1="136" y1="516" x2="264" y2="516"/><line x1="136" y1="524" x2="264" y2="524"/>
      <line x1="136" y1="532" x2="264" y2="532"/><line x1="136" y1="540" x2="264" y2="540"/>
      <line x1="136" y1="548" x2="264" y2="548"/><line x1="136" y1="556" x2="264" y2="556"/>
    </g>
    <g fill="#5b9bd5"><rect x="140" y="498" width="22" height="4"/><rect x="200" y="514" width="30" height="4"/><rect x="170" y="538" width="26" height="4"/></g>
  </g>
  <text x="202" y="585" text-anchor="middle" font-size="16" fill="#c9d1d9" font-weight="bold">Console</text>

  <!-- ============ Query API layer ============ -->
  <rect x="415" y="75" width="198" height="115" fill="#9e6a03" stroke="#d29922" stroke-width="1.5"/>
  <text x="514" y="105" text-anchor="middle" font-size="19" fill="#fff">Query API Layer</text>
  <rect x="430" y="122" width="170" height="56" fill="#8e2d3a" stroke="#f85149" stroke-width="2"/>
  <text x="515" y="145" text-anchor="middle" font-size="17" fill="#fff">Scope Query</text>
  <text x="515" y="166" text-anchor="middle" font-size="17" fill="#fff">Engine</text>

  <!-- ============ Data Lake DB Farm ============ -->
  <rect x="630" y="15" width="225" height="193" fill="#0d1117" stroke="#6e7681" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="742" y="38" text-anchor="middle" font-size="19" fill="#8b949e">Data Lake DB Farm</text>

  <!-- Cassandra (eyes) -->
  <g>
    <ellipse cx="726" cy="70" rx="30" ry="15" fill="#1c2b3a" stroke="#2e86c1" stroke-width="2"/>
    <circle cx="726" cy="70" r="9" fill="#2e86c1"/><circle cx="726" cy="70" r="4" fill="#0b2c47"/>
    <ellipse cx="760" cy="62" rx="30" ry="15" fill="#1c2b3a" stroke="#2e86c1" stroke-width="2"/>
    <circle cx="760" cy="62" r="9" fill="#2e86c1"/><circle cx="760" cy="62" r="4" fill="#0b2c47"/>
    <ellipse cx="790" cy="76" rx="30" ry="15" fill="#1c2b3a" stroke="#2e86c1" stroke-width="2"/>
    <circle cx="790" cy="76" r="9" fill="#2e86c1"/><circle cx="790" cy="76" r="4" fill="#0b2c47"/>
  </g>
  <text x="752" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#c9d1d9">Cassandra Cluster(s)</text>

  <!-- Elasticsearch (stacked bars) -->
  <g>
    <circle cx="745" cy="156" r="20" fill="#fdd835" opacity="0.9"/>
    <circle cx="745" cy="156" r="20" fill="none" stroke="#f9a825"/>
    <rect x="726" y="148" width="26" height="8" rx="4" fill="#243b5a"/>
    <rect x="738" y="159" width="26" height="8" rx="4" fill="#00b3a4"/>
    <rect x="726" y="170" width="26" height="8" rx="4" fill="#e91e63"/>
    <rect x="740" y="137" width="22" height="8" rx="4" fill="#00a9e5"/>
  </g>
  <text x="752" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#c9d1d9">Elasticsearch Cluster(s)</text>

  <!-- ============ ETL / Receiver / Queue / S3 ============ -->
  <!-- S3 bucket -->
  <g>
    <path d="M498 282 L548 282 L542 320 Q523 330 504 320 Z" fill="#e53935" stroke="#a52714" stroke-width="1.5"/>
    <ellipse cx="523" cy="282" rx="25" ry="6" fill="#ef9a9a" stroke="#a52714" stroke-width="1.5"/>
    <ellipse cx="523" cy="300" rx="9" ry="6" fill="#fff" opacity="0.9"/>
  </g>
  <text x="550" y="258" text-anchor="middle" font-size="12" fill="#8b949e">Backup to S3</text>

  <!-- ETL gears -->
  <g>
    <circle cx="672" cy="256" r="12" fill="none" stroke="#2a62a6" stroke-width="6" stroke-dasharray="4 3.2"/>
    <circle cx="672" cy="256" r="8" fill="url(#gearg)"/><circle cx="672" cy="256" r="3.5" fill="#fff"/>
    <circle cx="646" cy="272" r="17" fill="none" stroke="#2a62a6" stroke-width="7" stroke-dasharray="5 4"/>
    <circle cx="646" cy="272" r="12" fill="url(#gearg)"/><circle cx="646" cy="272" r="5" fill="#fff"/>
    <circle cx="678" cy="283" r="20" fill="none" stroke="#2a62a6" stroke-width="8" stroke-dasharray="5.5 4.4"/>
    <circle cx="678" cy="283" r="14" fill="url(#gearg)"/><circle cx="678" cy="283" r="6" fill="#fff"/>
  </g>
  <text x="800" y="250" text-anchor="middle" font-size="11" fill="#8b949e">Insert to Data Farm</text>
  <text x="750" y="298" text-anchor="middle" font-size="19" font-weight="bold" fill="#c9d1d9">ETL Worker</text>
  <text x="750" y="318" text-anchor="middle" font-size="14" fill="#c9d1d9">Parsing / Validation / Cleansing</text>

  <!-- Data processing queue -->
  <g>
    <rect x="695" y="341" width="54" height="28" fill="#ffd54f" stroke="#e08a00"/>
    <g fill="#e08a00"><rect x="702" y="346" width="6" height="18"/><rect x="713" y="346" width="6" height="18"/><rect x="724" y="346" width="6" height="18"/><rect x="735" y="346" width="6" height="18"/></g>
  </g>
  <text x="747" y="387" text-anchor="middle" font-size="12" fill="#8b949e">Data Processing Queue</text>

  <!-- Receiver -->
  <g>
    <circle cx="485" cy="366" r="29" fill="#ee7d3c" stroke="#c9601f" stroke-width="1.5"/>
    <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M469 366 H487"/><path d="M487 366 L501 354"/><path d="M487 366 L501 378"/><path d="M487 366 H501"/>
    </g>
    <rect x="541" y="349" width="22" height="22" fill="#f6a35c" stroke="#c9601f"/>
    <rect x="549" y="357" width="22" height="22" fill="#ee7d3c" stroke="#c9601f"/>
  </g>
  <path d="M516 366 L538 366" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
  <text x="557" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#c9d1d9">Receiver</text>

  <!-- Endpoint Agent -->
  <rect x="523" y="510" width="169" height="52" fill="#1f6feb" stroke="#58a6ff"/>
  <text x="607" y="543" text-anchor="middle" font-size="19" fill="#fff">Endpoint Agent</text>

  <!-- ============ Arrows ============ -->
  <g fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)">
    <!-- Portal -> AP -->
    <path d="M84 166 C84 134 100 130 128 130"/>
    <!-- AP -> LB -->
    <path d="M211 130 C226 130 232 140 240 150"/>
    <!-- AP -> Worker -->
    <path d="M171 152 L171 173"/>
    <!-- LB -> Worker (get result) -->
    <path d="M240 225 C228 225 224 215 220 210"/>
    <!-- LB -> Query API: issue Scope query -->
    <path d="M284 148 C320 135 350 122 412 118"/>
    <!-- Query API -> LB: get result / callback -->
    <path d="M412 150 C370 215 330 235 286 232"/>
    <!-- Bottom LB -> Portal -->
    <path d="M87 293 C62 255 70 230 80 212"/>
    <!-- Console -> bottom LB -->
    <path d="M137 480 L137 340"/>
    <!-- ETL -> Data farm -->
    <path d="M690 262 C760 258 772 238 760 212"/>
    <!-- ETL -> S3 -->
    <path d="M630 276 C600 285 575 292 553 296"/>
    <!-- Receiver -> Queue -->
    <path d="M578 372 C620 380 660 366 692 358"/>
    <!-- Queue -> ETL -->
    <path d="M693 352 C648 350 624 336 632 304"/>
    <!-- Agent -> Receiver -->
    <path d="M570 508 C520 480 495 450 490 400"/>
  </g>
  <!-- bidirectional arrows to DB -->
  <g fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)">
    <path d="M616 115 C640 110 650 95 678 82"/>
    <path d="M616 152 C640 158 660 160 684 156"/>
  </g>

  <!-- ============ Arrow labels ============ -->
  <g font-size="12" text-anchor="middle">
    <text x="340" y="96" fill="#58a6ff" font-weight="bold">Issue</text>
    <text x="340" y="112" fill="#58a6ff" font-weight="bold">Scope Query</text>
    <text x="410" y="258" fill="#58a6ff" font-weight="bold">Get result or callback</text>
    <text x="410" y="275" fill="#58a6ff" font-weight="bold">(async mode only)</text>
    <text x="196" y="383" fill="#8b949e">Trigger</text>
    <text x="196" y="399" fill="#8b949e">Scope Query</text>
    <text x="640" y="478" fill="#8b949e">Upload</text>
    <text x="640" y="494" fill="#8b949e">Event Logs</text>
  </g>
</svg>
