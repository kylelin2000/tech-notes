<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" role="img" aria-label="Hermes Agent 架構：agent 不持憑證，所有內部呼叫與排程 job 都經 tool broker 這個單一出口">
